<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Search App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/home.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/waypoints/4.0.1/jquery.waypoints.min.js"></script>
</head>
<body>
<main class="app-content">
      <header class="app-header">
        <h1>Search for flights</h1>
      </header>

      <section class="search-section">
        <div class="search-inputs">
          <div class="input-group">
            <label>From</label>
            <input type="text" placeholder="Enter departure city">
          </div>
          <div class="swap-button">⇅</div>
          <div class="input-group">
            <label>To</label>
            <input type="text" placeholder="Enter destination">
          </div>
        </div>
        <div class="filter-icon">⚙️</div>
      </section>

      <section class="destinations-section">
        <div class="section-header">
          <h2>Popular destinations</h2>
          <button class="see-all"><i data-lucide="chevron-right"></i></button>
        </div>
        <div class="destinations-grid">
          <div class="destination-card">
            <div class="destination-image warsaw"></div>
            <div class="destination-info">
              <h3>Warsaw</h3>
              <p>Poland</p>
            </div>
            <div class="favorite-btn">♡</div>
          </div>
          <div class="destination-card">
            <div class="destination-image berlin"></div>
            <div class="destination-info">
              <h3>Berlin</h3>
              <p>Germany</p>
            </div>
            <div class="favorite-btn">♡</div>
          </div>
          <div class="destination-card">
            <div class="destination-image porto"></div>
            <div class="destination-info">
              <h3>Porto</h3>
              <p>Portugal</p>
            </div>
            <div class="favorite-btn">♡</div>
          </div>
          <div class="destination-card">
            <div class="destination-image london"></div>
            <div class="destination-info">
              <h3>London</h3>
              <p>England</p>
            </div>
            <div class="favorite-btn">♡</div>
          </div>
        </div>
      </section>

      <section class="offers-section">
        <div class="section-header">
          <h2>Special offers</h2>
          <button class="see-all"><i data-lucide="chevron-right"></i></button>
        </div>
        <div class="offers-grid">
          <div class="offer-card">
            <div class="offer-image milan"></div>
            <div class="offer-info">
              <h3>Milan</h3>
              <p>Italy</p>
              <span class="price">47$</span>
              
            </div>
            <div class="favorite-btn">♡</div>
          </div>
          <div class="offer-card">
            <div class="offer-image vienna"></div>
            <div class="offer-info">
              <h3>Vienna</h3>
              <p>Austria</p>
            </div>
            <div class="favorite-btn">♡</div>
          </div>
        </div>
      </section>

      <section class="categories-section">
        <div class="section-header">
          <h2>Destination categories</h2>
          <button class="see-all"><i data-lucide="chevron-right"></i></button> 
        </div>

  <div class="categories-tabs">
          <button class="category-tab active">
            <i data-lucide="plane"></i>
            <span>Flights</span>
          </button>
          <button class="category-tab">
            <i data-lucide="heart"></i>
            <span>Saved</span>
          </button>
          <button class="category-tab">
            <i data-lucide="ticket"></i>
            <span>My trips</span>
          </button>
          <button class="category-tab">
            <i data-lucide="user-round"></i>
            <span>Profile</span>
          </button>
    </div>
        
      </section>
    </main>
<script src="https://unpkg.com/lucide@latest"></script>
  <script src="home.js"></script>
  <script>
     lucide.createIcons();
   </script>
</body>
</html>
