<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body2>
  <div class="signup-container">
    <h2>Sign Up</h2>
    <form class="signup-form" id="signup-form">
      <input type="email" id="email" placeholder="email@gmail.com" required />
      <p class="error" id="email-error"></p>

      <div class="password-wrapper">
        <input type="password" id="password" placeholder="At least 8 characters" required minlength="8"/>
        <span class="toggle-password" onclick="togglePassword()">👁</span>
      </div>
      <p class="error" id="password-error"></p>

      <button type="submit" id="signup-btn" class="signup-btn" disabled>Sign Up</button>
    </form>
    <p class="error" id="firebase-error"></p>

    <div class="divider">or</div>
    <div class="social-buttons">
      <button class="google">
  <img src="image/google.png" alt="Google" class="icon" />
  Continue with Google
</button>
<button class="google">
  <img src="image/apple.png" alt="apple" class="icon" />
  Continue with Apple
</button><button class="google">
  <img src="image/facebook.png" alt="facebook" class="icon" />
  Continue with Facebook
</button>
    </div>
    <p class="login-link">Already have an account? <a href="login.html">Log In</a></p>
  </div>
  <script src="script.js"></script>
  <script type="module" src="script.js">

  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";

  // https://firebase.google.com/docs/web/setup#available-libraries

    projectId: "fir-state-b4ce7",
    storageBucket: "fir-state-b4ce7.firebasestorage.app",

  </div>
</body2>
</html>
